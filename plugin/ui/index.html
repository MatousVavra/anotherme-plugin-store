<div class="store-plugin" x-data="storePlugin()">
    <header class="store-header">
        <h2>Community Plugins</h2>
        <span class="store-stale" x-show="stale">Offline &mdash; showing cached list</span>
        <input type="search" class="store-search" x-model="search" placeholder="Search plugins&hellip;">
        <button class="btn-secondary" @click="refresh()" :disabled="loading"
                x-text="loading ? 'Refreshing\u2026' : 'Refresh'"></button>
    </header>

    <div class="store-grid">
        <template x-for="p in filteredPlugins" :key="p.name">
            <div class="store-card" :class="{ installed: p.installed }">
                <div class="store-card-head">
                    <strong x-text="p.name"></strong>
                    <span class="store-tag" x-text="p.tag"></span>
                </div>
                <p class="store-desc" x-text="p.description"></p>
                <div class="store-meta">
                    <span x-text="`by ${p.author}`"></span>
                    <span x-show="p.installed"
                          x-text="`installed ${p.installed_version} \u00b7 available ${p.tag}`"></span>
                    <span x-show="!p.installed" x-text="`available ${p.tag}`"></span>
                    <span class="store-bundled" x-show="p.bundled">bundled</span>
                </div>
                <div class="store-actions">
                    <button x-show="!p.installed" class="btn-primary"
                            @click="install(p)" :disabled="busy[p.name]"
                            x-text="busy[p.name] === 'installing' ? 'Installing\u2026' : 'Install'"></button>
                    <button x-show="p.update_available" class="btn-primary"
                            @click="update(p)" :disabled="busy[p.name]"
                            x-text="busy[p.name] === 'updating' ? 'Updating\u2026' : 'Update'"></button>
                    <button x-show="p.installed && !p.bundled" class="btn-danger"
                            @click="uninstall(p)" :disabled="busy[p.name]"
                            x-text="busy[p.name] === 'removing' ? 'Removing\u2026' : 'Remove'"></button>
                    <a class="store-repo-link" x-show="p.repo"
                       :href="`https://github.com/${p.repo}`" target="_blank" rel="noopener">GitHub</a>
                </div>
            </div>
        </template>
        <p x-show="!loading && plugins.length > 0 && filteredPlugins.length === 0" class="store-empty">
            No plugins match your search.
        </p>
        <p x-show="!loading && plugins.length === 0" class="store-empty">
            No community plugins published yet.
        </p>
    </div>

    <div class="store-sideload">
        <h3>Install from URL</h3>
        <p class="store-warning">
            Unreviewed code &mdash; it will run with full access to your vault and AI keys.
            Only continue if you trust the source.
        </p>
        <form @submit.prevent="sideload()">
            <input type="url" class="store-url-input" x-model="sideloadUrl" placeholder="https://..." required>
            <button type="submit" class="btn-danger" :disabled="sideloadBusy"
                    x-text="sideloadBusy ? 'Installing\u2026' : 'Install'"></button>
        </form>
    </div>
</div>
